name: CI

# The repo had no pull-request CI at all: lint, types, build, tests and — the
# expensive one — dependency resolution were first exercised by the publish
# workflow, so a bad resolution only announced itself as a failed release.
# v4.0.0 died that way on ERR_PNPM_IGNORED_BUILDS.
#
# `verify` runs the same preflight the release runs, on every PR.
# `fresh-resolve` throws away the lockfile once a week so drift in transitive
# dependencies (a new install script, a dropped optional dep) surfaces on a
# schedule instead of on release day.

# Pull requests run only when they target `dev` (the integration branch) or `main` (releases), and a
# DRAFT runs nothing until it is marked ready. A draft can then hold work that is red by design —
# pins written for a factory release not yet published, which this job resolves from npm — without a
# failing run on it. `ready_for_review` is listed so marking it ready starts the run.
#
# Pushes run on `main` only, as factory's verify.yml does (CA, 2026-10-10). A push to `dev` is the
# merge of a PR that this workflow has just verified, so running again there repeated every PR's run
# (42 push runs in the week to 2026-10-10). This replaces the 2026-10-02 rule that verified each merge
# into `dev` as merged; the dev→main checkpoint PR and the push to `main` still verify the merged tree.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # release-scope.sh diffs the PR's merge commit against its first parent, the base tip.
          fetch-depth: 2

      # The release path's light path: a release-please PR into `main`, or the back-merge PR
      # (`main` -> `dev`, opened by back-merge.yml), whose diff is the version files alone skips
      # every step below the lockfile guard. Its tree was verified when it landed, and `verify`
      # still reports, so `main`'s required check passes. Anything else gets the full run.
      - name: Release-path scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/release-scope.sh

      # A pnpm that does not match this repo's `packageManager` pin writes an `@pnpm/exe` block
      # into the lockfile; a pnpm that DOES match strips it out again. Committed, it makes every
      # correctly-provisioned checkout permanently dirty and drowns real work in `git status`. It was
      # cleaned out of six repos on 2026-09-08 and reappeared in two working trees the same
      # afternoon, so the committed state needs a guard rather than vigilance.
      #
      # The pattern excludes `@pnpm/exe.<platform>` — those are legitimate optional deps of `pnpm`
      # itself and every clean lockfile holds 24 of them, so the obvious grep fails every repo.
      - name: Lockfiles must not carry an @pnpm/exe block
        run: |
          locks=$(git ls-files '*pnpm-lock.yaml')
          if [ -z "$locks" ]; then
            echo "::error::no tracked pnpm-lock.yaml found — this check would pass vacuously"
            exit 1
          fi
          bad=0
          while IFS= read -r f; do
            if grep -qE "@pnpm/exe[^.]" "$f"; then
              echo "::error file=$f::$f carries an @pnpm/exe block, written only by a pnpm that does not match this repo's packageManager pin. Reinstall with the pinned pnpm and commit the lockfile."
              bad=1
            fi
          done <<LOCKS
          $locks
          LOCKS
          exit $bad

      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.light != 'true'
        # pnpm version comes from package.json's `packageManager` field;
        # naming it here too raises ERR_PNPM_BAD_PM_VERSION.

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.light != 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Prepare checkout for CI
        if: steps.scope.outputs.light != 'true'
        run: node scripts/ci-prepare.mjs

      # --no-frozen-lockfile, not --frozen-lockfile: ci-prepare.mjs removed the
      # link: override the lockfile was resolved with, so pnpm has to re-resolve
      # that one entry. Everything else stays pinned to the committed lockfile.
      - run: pnpm install --no-frozen-lockfile
        if: steps.scope.outputs.light != 'true'

      - run: pnpm lint
        if: steps.scope.outputs.light != 'true'
      - run: pnpm check-types
        if: steps.scope.outputs.light != 'true'
      - run: pnpm build
        if: steps.scope.outputs.light != 'true'
      - run: pnpm test
        if: steps.scope.outputs.light != 'true'

  fresh-resolve:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Prepare checkout for CI, without the lockfile
        run: node scripts/ci-prepare.mjs --drop-lockfile

      - run: pnpm install

      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm build
      - run: pnpm test

      - name: Explain a failure
        if: failure()
        run: |
          echo "::notice::Resolving without the lockfile no longer works. Something in the"
          echo "::notice::dependency graph moved — most often a new transitive package with an"
          echo "::notice::install script (decide it in pnpm-workspace.yaml allowBuilds:), or a"
          echo "::notice::breaking minor. Committed-lockfile builds are unaffected until the next"
          echo "::notice::renovate lock-file-maintenance PR pulls the change in."
