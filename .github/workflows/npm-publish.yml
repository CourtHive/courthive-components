name: Publish to npm

# Fires when a GitHub release is published. release-please creates
# the release via a GitHub-App-issued token (see release-please.yml),
# so the `release: published` event is delivered to this workflow.
# (The default GITHUB_TOKEN would silently drop the event under
# GitHub's loop-prevention rules.)
#
# `workflow_dispatch` is kept as a manual escape hatch — pass a
# `tag` input (e.g. `v1.0.4`) to publish a tag that already exists.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.4). Must already exist.'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve tag
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - uses: pnpm/action-setup@v6
        # pnpm version is resolved from package.json's `packageManager` field.
        # Specifying `version:` here too makes the action error out with
        # "Multiple versions of pnpm specified" (ERR_PNPM_BAD_PM_VERSION).

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Prepare checkout for CI
        # Strips the local-dev `link:../<repo>` overrides (CI has no siblings on
        # disk) and refuses to publish if a link: value has leaked into a
        # dependency table. Shared with ci.yml so the release preflight and the
        # PR preflight cannot drift apart.
        run: node scripts/ci-prepare.mjs

      # The lockfile is kept deliberately. It used to be deleted here, which made
      # every release resolve the whole graph afresh — so a release could install
      # dependency versions no PR had ever run, and v4.0.0 failed on exactly that
      # (jest-haste-map@30 dragging in @parcel/watcher's install script).
      # --no-frozen-lockfile because ci-prepare.mjs just removed the link:
      # override the lockfile was resolved with; only that entry re-resolves.
      # ci.yml's weekly fresh-resolve job still exercises the lockfile-less path.
      - run: pnpm install --no-frozen-lockfile

      - run: pnpm lint

      # Explicit type gate. `build` also runs tsc now, but a dedicated step fails with a
      # clear signal instead of burying type errors in a bundler log. This repo shipped
      # 3.12.0 with 11 type errors because `build` was bundler-only and nothing ran tsc.
      - run: pnpm check-types

      - run: pnpm build

      - run: pnpm test

      # NOTE: Storybook play-function tests (build-storybook + test-storybook)
      # were removed from the publish gate. @storybook/test-runner@0.24.4's
      # injected harness fails on the Linux runner (StorybookTestRunnerError TDZ,
      # all stories fail) in a way that is not reproducible locally across node
      # 22/24, storybook 10.4.4/10.4.6, playwright 1.60/1.61 or factory 5.9/6.0 —
      # so it was blocking good releases without catching real regressions. The
      # stories are exercised locally (pnpm test-storybook) and can be re-added
      # to a PR check once the runner incompatibility is resolved.

      - name: Determine npm dist-tag
        id: distTag
        run: |
          VERSION="${{ steps.ref.outputs.version }}"
          if [[ "$VERSION" == *"-alpha"* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-beta"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - run: npm publish --provenance --access public --tag ${{ steps.distTag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
